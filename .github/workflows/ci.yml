name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: diag loop
        shell: bash
        env:
          SYMNAV_DIAG_LAPS: ${{ runner.temp }}/laps.txt
        run: |
          for i in $(seq 1 20); do
            echo "=== iteration $i"
            (cd packages/daemon && npx vitest run src/process/process-coordinator.test.ts 2>&1 | grep -E "✓|×|FAIL|Tests|Error" | head -40) || true
            (cd apps/cli && npx vitest run test/e2e/daemon/stop.test.ts -t "kills accepted stuck work" 2>&1 | grep -E "✓|×|FAIL|Tests|Error|elapsedMs" | head -40) || true
          done
          cat "$SYMNAV_DIAG_LAPS" || true
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: version
        run: |
          version="$(node -p "require('./apps/cli/package.json').version")-smoke-${GITHUB_SHA::7}"
          npm version "$version" --no-git-tag-version --prefix apps/cli
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter symnav pack --pack-destination "$RUNNER_TEMP/symnav-tarball"
      - uses: actions/upload-artifact@v4
        with:
          name: symnav-tarball
          path: ${{ runner.temp }}/symnav-tarball/*.tgz
          if-no-files-found: error
  install-smoke:
    needs: pack
    uses: ./.github/workflows/install-smoke.yml
    with:
      tarball-artifact: symnav-tarball
      expected-version: ${{ needs.pack.outputs.version }}
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SYMNAV_REQUIRE_SANDBOX_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter symnav exec vitest run test/e2e/sandbox/warm-navigation.test.ts test/e2e/sandbox/doctor.test.ts
